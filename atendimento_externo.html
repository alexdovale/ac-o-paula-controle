<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mesa de Trabalho Judicial - SIGEP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/esm/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("aGL-Q2UJcD2tDpUKq"); })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="p-2 md:p-6 min-h-screen flex justify-center items-start pt-4 sm:pt-10">

    <div id="shell-atendimento" class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-slate-200">
        
        <div id="header-bg" class="bg-slate-800 p-5 text-white transition-all duration-500 flex items-center gap-4 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-48 h-48 bg-blue-500 opacity-10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
            
            <button id="btn-voltar-dashboard" class="hidden shrink-0 bg-white/10 hover:bg-white/20 text-white p-2 rounded-lg transition-colors border border-white/20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>

            <div class="flex flex-col overflow-hidden w-full relative z-10">
                <h1 id="assistido-nome" class="font-black text-xl uppercase truncate tracking-tight">PAINEL DE ATENDIMENTO</h1>
                <p id="assistido-assunto" class="text-xs text-blue-200 opacity-90 truncate mt-1 font-semibold uppercase tracking-wider">Carregando dados da sua sessão...</p>
            </div>

            <div id="status-indicator" class="hidden absolute top-4 right-4 bg-emerald-500 text-white text-[9px] font-black px-2 py-1 rounded-full shadow-lg border border-emerald-400 uppercase tracking-widest animate-pulse z-20">
                🟢 ONLINE
            </div>
        </div>

        <div id="view-dashboard" class="flex flex-col flex-1">
            <div class="flex border-b bg-slate-50 select-none border-slate-200 font-semibold text-xs tracking-wider overflow-x-auto custom-scrollbar">
                <button id="btn-tab-minha-mesa" class="flex-1 p-4 text-center font-black uppercase text-white bg-amber-600 border-b-2 border-amber-600 transition-colors focus:outline-none whitespace-nowrap">
                    💻 Minha Mesa
                </button>
                <button id="btn-tab-aguardando" class="flex-1 p-4 text-center font-bold uppercase text-slate-500 border-b-2 border-transparent hover:text-slate-700 hover:bg-slate-100 transition-colors focus:outline-none whitespace-nowrap">
                    📥 Aguardando Atendimento
                </button>
                <button id="btn-tab-pauta-atual" class="flex-1 p-4 text-center font-bold uppercase text-slate-500 border-b-2 border-transparent hover:text-slate-700 hover:bg-slate-100 transition-colors focus:outline-none whitespace-nowrap">
                    📋 Pauta Atual
                </button>
            </div>

            <div class="p-4 sm:p-6 bg-slate-50/50 flex-1">
                <div id="painel-atendimento-container" class="w-full min-h-[300px]">
                    <div class="flex flex-col justify-center items-center py-20 gap-3">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-amber-600"></div>
                        <p class="text-[10px] font-black text-amber-600 tracking-widest uppercase">Sincronizando pauta...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-atendimento" class="hidden flex-col flex-1">
            <div class="flex border-b bg-slate-50 select-none border-slate-200 font-semibold text-xs tracking-wider overflow-x-auto custom-scrollbar">
                <button id="tab-btn-encerramento" class="flex-1 p-4 text-center font-black uppercase text-slate-800 border-b-2 border-slate-800 transition-colors focus:outline-none whitespace-nowrap">
                    Encerramento / Fluxo
                </button>
                <button id="tab-btn-historico" class="flex-1 p-4 text-center font-bold uppercase text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-colors focus:outline-none whitespace-nowrap">
                    Histórico Recepção
                </button>
            </div>

            <div class="p-4 sm:p-6 bg-white flex-1">
                <div id="aba-encerramento" class="space-y-6">
                    
                    <!-- PAINEL DE FOTOS ENVIADAS PELO CIDADÃO NA TRIAGEM -->
                    <div id="painel-fotos-servidor" class="hidden bg-slate-900 rounded-2xl p-4 shadow-md border border-slate-700 animate-fade-in">
                        <h4 class="text-xs font-black text-amber-400 uppercase tracking-widest flex items-center gap-2 mb-3">
                            <span>📱</span> Documentos Anexados pelo Cidadão (Celular)
                        </h4>
                        <div id="grid-fotos-recebidas" class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <!-- As fotos do cidadão preenchem aqui dinamicamente -->
                        </div>
                    </div>

                    <!-- NOVO: PAINEL DE DOCUMENTOS DIGITALIZADOS NA RECEPÇÃO (COM SENHA) -->
                    <div id="painel-documentos-seguros" class="hidden bg-slate-900 rounded-2xl p-4 shadow-md border border-slate-700 mt-4 animate-fade-in">
                        <h4 class="text-xs font-black text-amber-400 uppercase tracking-widest flex items-center gap-2 mb-3">
                            <span>📑</span> Documentos Digitalizados (Recepção)
                        </h4>
                        <div id="grid-documentos-seguros" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <!-- Os botões de PDF da recepção preenchem aqui -->
                        </div>
                    </div>

                    <div id="area-colaborador" class="hidden">
                        <div class="flex flex-col justify-center items-center py-20 gap-3">
                            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-slate-800"></div>
                            <p class="text-[10px] font-black text-slate-400 tracking-widest uppercase">Construindo Mesa de Trabalho...</p>
                        </div>
                    </div>
                </div>

                <div id="aba-historico" class="hidden animate-fade-in">
                    <div id="lista-historico" class="space-y-4">
                        <div class="flex flex-col justify-center items-center py-20 gap-3">
                            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
                            <p class="text-[10px] font-black text-indigo-400 tracking-widest uppercase">Puxando documentos da recepção...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex justify-between items-center text-[10px] font-semibold text-slate-400 shrink-0 select-none">
            <span>SIGEP • Mesa Unificada de Trabalho</span>
            <span class="font-mono text-[9px]">v2.0-2026</span>
        </div>
    </div>

    <script type="module">
        import { AtendimentoExternoService } from './js/atendimentoExternoService.js';
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { firebaseConfig } from './js/config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Função Global para solicitar a senha e abrir o PDF protegido
        window.solicitarSenhaEAbriDoc = (url, senhaCorreta) => {
            const digitada = prompt("🔒 Digite a senha de proteção deste documento:");
            if (digitada === senhaCorreta) {
                window.open(url, '_blank');
            } else if (digitada !== null) {
                alert("❌ Senha incorreta! O documento não pode ser aberto.");
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const searchLimpa = window.location.search.replace(/&amp;/g, '&');
            const urlParams = new URLSearchParams(searchLimpa);
            const assistidoId = urlParams.get('assistidoId') || urlParams.get('aid');
            const pautaId = urlParams.get('pid') || urlParams.get('pautaId');

            if (assistidoId) {
                document.getElementById('view-dashboard').classList.add('hidden');
                document.getElementById('view-atendimento').classList.remove('hidden');
                document.getElementById('btn-voltar-dashboard').classList.remove('hidden');

                if (pautaId) {
                    onSnapshot(doc(db, "pautas", pautaId, "attendances", assistidoId), (snap) => {
                        if (!snap.exists()) return;
                        const data = snap.data();
                        
                        // 1. Lógica das Fotos da Triagem
                        const fotos = data.documentChecklist?.fotosAnexadas || [];
                        const painelServidor = document.getElementById('painel-fotos-servidor');
                        const gridFotos = document.getElementById('grid-fotos-recebidas');

                        if (fotos.length > 0) {
                            painelServidor.classList.remove('hidden');
                            gridFotos.innerHTML = fotos.map((f, i) => `
                                <a href="${f.url}" target="_blank" class="bg-slate-800 hover:bg-indigo-600 border border-slate-600 text-white font-bold text-[10px] p-2.5 rounded-xl text-center shadow transition-all block uppercase tracking-wider flex items-center justify-center gap-1.5">
                                    <span class="text-base">🔍</span> Ver Foto ${i + 1}
                                </a>
                            `).join('');
                        } else {
                            painelServidor.classList.add('hidden');
                        }

                        // 2. Lógica dos Documentos Digitalizados pela Recepção
                        const documentosSeguros = data.documentosDigitalizados || [];
                        const painelDocsSeguros = document.getElementById('painel-documentos-seguros');
                        const gridDocsSeguros = document.getElementById('grid-documentos-seguros');

                        if (documentosSeguros.length > 0) {
                            painelDocsSeguros.classList.remove('hidden');
                            gridDocsSeguros.innerHTML = documentosSeguros.map((docItem) => `
                                <button onclick="solicitarSenhaEAbriDoc('${docItem.url}', '${docItem.senhaPin}')" 
                                    class="bg-slate-800 hover:bg-indigo-600 border border-slate-700 text-white font-bold text-[10px] p-3 rounded-xl text-left shadow transition-all flex items-center justify-between">
                                    <div class="truncate pr-2">
                                        <p class="text-amber-300 uppercase font-black text-[11px]">${docItem.titulo || 'Documento'}</p>
                                        <p class="text-slate-400 text-[9px] truncate">Arquivo: ${docItem.nomeArquivo || 'PDF'}</p>
                                    </div>
                                    <span class="bg-slate-900 text-white px-2.5 py-1.5 rounded-lg shrink-0 uppercase tracking-wider text-[9px] flex items-center gap-1">
                                        <span>🔒</span> Abrir
                                    </span>
                                </button>
                            `).join('');
                        } else {
                            painelDocsSeguros.classList.add('hidden');
                        }

                    });
                }
            } else {
                document.getElementById('shell-atendimento').classList.add('hidden');
            }

            AtendimentoExternoService.init();

            document.getElementById('btn-voltar-dashboard').addEventListener('click', () => {
                const urlAtual = new URL(window.location.href);
                urlAtual.searchParams.delete('assistidoId');
                urlAtual.searchParams.delete('aid');
                urlAtual.searchParams.delete('token');
                urlAtual.searchParams.delete('view');
                window.location.href = urlAtual.toString();
            });
        });
    </script>
</body>
</html>
