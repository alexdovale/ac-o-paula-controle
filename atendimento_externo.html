<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4">

    <!-- Container onde o serviço renderiza tudo -->
    <div id="atendimento-externo-container" class="max-w-6xl mx-auto"></div>

    <script type="module">
        import { AtendimentoExternoService } from './js/atendimentoExternoService.js';
        window.AtendimentoExternoService = AtendimentoExternoService;

        // Inicialização global
        document.addEventListener('DOMContentLoaded', async () => {
            await AtendimentoExternoService.init();
        });
    </script>
</body>
</html>
