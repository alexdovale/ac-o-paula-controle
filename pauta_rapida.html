<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEP - Gestão Rápida de Documentos da Pauta</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Cabeçalho -->
        <header class="bg-white shadow rounded-2xl p-5 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-xl font-black text-slate-900 flex items-center gap-2">
                    <span>📄</span> Pauta Rápida - Adobe Scan & Docs
                </h1>
                <p class="text-xs text-slate-500 mt-1">Gerencie links, observações e status "No Verde" em tempo real</p>
            </div>
            <div id="pauta-nome-badge" class="bg-violet-100 text-violet-800 text-xs font-bold px-3 py-1.5 rounded-xl border border-violet-200">
                Carregando pauta...
            </div>
        </header>

        <!-- Barra de Ações / Filtros -->
        <div class="bg-white p-4 rounded-2xl shadow mb-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <input type="text" id="filtro-assistido" placeholder="Pesquisar assistido na pauta..." 
                class="w-full sm:w-72 p-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-violet-500">
            <div class="text-xs text-slate-500 font-medium" id="contador-status">
                Total: 0 assistidos
            </div>
        </div>

        <!-- Lista de Assistidos (Injetada via JS) -->
        <div id="lista-assistidos-rapida" class="space-y-3">
            <div class="text-center py-12 text-slate-400 font-medium">Carregando dados do Firebase...</div>
        </div>
    </div>

    <!-- Firebase SDKs e Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { firebaseConfig } from './js/config.js';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Pega o pautaId da URL (ex: pauta_rapida.html?pautaId=XYZ)
        const urlParams = new URLSearchParams(window.location.search);
        const pautaId = urlParams.get('pautaId');

        if (!pautaId) {
            document.body.innerHTML = `<div class="p-8 text-center text-red-600 font-bold">Erro: ID da pauta não informado na URL. (Use ?pautaId=SEU_ID)</div>`;
        } else {
            carregarDadosPauta(db, pautaId);
        }

        function carregarDadosPauta(db, pautaId) {
            // Escuta os assistidos em tempo real
            const ref = collection(db, "pautas", pautaId, "attendances");
            onSnapshot(ref, (snapshot) => {
                const assistidos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderizarLista(db, pautaId, assistidos);
            });
        }

        function renderizarLista(db, pautaId, assistidos) {
            const container = document.getElementById('lista-assistidos-rapida');
            document.getElementById('contador-status').textContent = `Total: ${assistidos.length} assistidos`;

            if (assistidos.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400">Nenhum assistido encontrado nesta pauta.</div>`;
                return;
            }

            container.innerHTML = assistidos.map(a => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-black text-slate-800 text-sm">${escapeHTML(a.name || 'Sem Nome')}</h3>
                            <p class="text-[11px] text-slate-500">Status Fila: <span class="font-bold text-slate-700 uppercase">${a.status || 'pauta'}</span></p>
                        </div>
                        <!-- Botão No Verde -->
                        <button onclick="toggleNoVerdeExterno('${pautaId}', '${a.id}', ${a.noVerde || false})" 
                            class="px-3 py-1.5 rounded-xl font-bold text-xs transition-all shadow-sm ${a.noVerde ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                            ${a.noVerde ? '✅ No Verde' : '⏳ Pendente no Verde'}
                        </button>
                    </div>

                    <!-- Input de Link do PDF -->
                    <div class="flex gap-2 items-center">
                        <input type="text" id="link-${a.id}" value="${a.pdfLink || ''}" placeholder="Cole o link do PDF escaneado..." 
                            class="flex-1 p-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white focus:border-violet-500 outline-none">
                        <button onclick="salvarLinkExterno('${pautaId}', '${a.id}')" class="bg-violet-600 hover:bg-violet-700 text-white font-bold px-3 py-2 rounded-xl text-xs transition">
                            Salvar Link
                        </button>
                        ${a.pdfLink ? `
                            <a href="${a.pdfLink}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded-xl text-xs transition flex items-center gap-1">
                                👁️ Abrir
                            </a>
                        ` : ''}
                    </div>

                    <!-- Input de Observações -->
                    <div class="flex gap-2 items-center">
                        <input type="text" id="obs-${a.id}" value="${escapeHTML(a.pdfObservacoes || '')}" placeholder="Observações (ex: Falta comprovante...)" 
                            class="flex-1 p-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white focus:border-violet-500 outline-none">
                        <button onclick="salvarObsExterno('${pautaId}', '${a.id}')" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-3 py-2 rounded-xl text-xs transition">
                            Atualizar Obs
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Funções globais de ação na página externa
        window.salvarLinkExterno = async function(pautaId, assistidoId) {
            const val = document.getElementById(`link-${assistidoId}`).value.trim();
            await updateDoc(doc(db, "pautas", pautaId, "attendances", assistidoId), { pdfLink: val });
            alert("Link do PDF salvo com sucesso!");
        }

        window.salvarObsExterno = async function(pautaId, assistidoId) {
            const val = document.getElementById(`obs-${assistidoId}`).value.trim();
            await updateDoc(doc(db, "pautas", pautaId, "attendances", assistidoId), { pdfObservacoes: val });
            alert("Observações atualizadas!");
        }

        window.toggleNoVerdeExterno = async function(pautaId, assistidoId, atual) {
            await updateDoc(doc(db, "pautas", pautaId, "attendances", assistidoId), { noVerde: !atual });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
            );
        }
    </script>
</body>
</html>
