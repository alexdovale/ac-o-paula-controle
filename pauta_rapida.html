<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEP - Gestão Rápida de Documentos (Adobe Scan & Storage)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Cabeçalho -->
        <header class="bg-white shadow-sm rounded-2xl p-5 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border border-slate-200">
            <div>
                <h1 class="text-xl font-black text-slate-900 flex items-center gap-2">
                    <span>📄</span> Pauta Rápida - Adobe Scan & Storage
                </h1>
                <p id="modo-painel-desc" class="text-xs text-slate-500 mt-1">Carregando painel...</p>
            </div>
            <div id="status-pauta-badge" class="bg-violet-100 text-violet-800 text-xs font-bold px-3 py-1.5 rounded-xl border border-violet-200">
                Conectando...
            </div>
        </header>

        <!-- Barra de Busca -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <input type="text" id="filtro-assistido" placeholder="Pesquisar assistido na pauta..." 
                class="w-full sm:w-80 p-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-violet-500">
            <div class="text-xs text-slate-500 font-semibold" id="contador-status">
                Total: 0 assistidos
            </div>
        </div>

        <!-- Lista de Assistidos -->
        <div id="lista-assistidos-rapida" class="space-y-3">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400 font-medium">
                Carregando dados do Firebase...
            </div>
        </div>
    </div>

    <!-- Script de Conexão Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { firebaseConfig } from './js/config.js';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        const urlParams = new URLSearchParams(window.location.search);
        const pautaId = urlParams.get('pautaId');

        let usuarioLogado = false;

        if (!pautaId) {
            document.body.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white p-6 rounded-2xl shadow-md border border-red-200 text-center max-w-md w-full">
                        <span class="text-3xl mb-2 block">⚠️</span>
                        <h2 class="font-bold text-slate-800 text-base mb-1">Pauta não informada</h2>
                        <p class="text-xs text-slate-500">Para acessar esta tela, utilize o link gerado pelo sistema.</p>
                    </div>
                </div>`;
        } else {
            // Monitora o login de forma opcional (sem travar a tela se não estiver logado)
            onAuthStateChanged(auth, (user) => {
                usuarioLogado = !!user;
                atualizarInterfaceModo();
            }, (error) => {
                console.warn("Aviso de auth:", error);
                usuarioLogado = false;
                atualizarInterfaceModo();
            });

            // Carrega os dados da pauta imediatamente
            escutarPauta(db, pautaId);
        }

        function atualizarInterfaceModo() {
            const descEl = document.getElementById('modo-painel-desc');
            if (usuarioLogado) {
                descEl.textContent = "Modo Operador: Envio de arquivos e edições liberados ⚙️";
            } else {
                descEl.textContent = "Modo Consulta Externa: Visualização de documentos em tempo real 👁️";
            }
        }

        function escutarPauta(db, pautaId) {
            onSnapshot(doc(db, "pautas", pautaId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('status-pauta-badge').textContent = `Pauta: ${data.name || 'Ativa'}`;
                } else {
                    document.getElementById('status-pauta-badge').textContent = `Pauta não encontrada`;
                }
            }, (err) => {
                console.error("Erro ao ler pauta:", err);
                document.getElementById('status-pauta-badge').textContent = `Erro de conexão`;
            });

            const refCol = collection(db, "pautas", pautaId, "attendances");
            onSnapshot(refCol, (snapshot) => {
                const assistidos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                assistidos.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                window._assistidosCache = assistidos;
                renderizarLista(assistidos);
            }, (err) => {
                console.error("Erro ao ler assistidos:", err);
                document.getElementById('lista-assistidos-rapida').innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-red-200 text-center text-red-500 text-xs font-bold">
                        Erro ao carregar os dados da pauta. Verifique se o ID está correto.
                    </div>`;
            });
        }

        function renderizarLista(assistidos) {
            const container = document.getElementById('lista-assistidos-rapida');
            const termoFiltro = document.getElementById('filtro-assistido').value.toLowerCase().trim();

            const filtrados = assistidos.filter(a => (a.name || '').toLowerCase().includes(termoFiltro));
            document.getElementById('contador-status').textContent = `Total: ${filtrados.length} de ${assistidos.length} assistidos`;

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400 text-xs">Nenhum assistido encontrado nesta pauta.</div>`;
                return;
            }

            container.innerHTML = filtrados.map(a => {
                const btnVerdeClass = a.noVerde ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200';
                const disabledAttr = !usuarioLogado ? 'disabled opacity-75 cursor-not-allowed' : '';
                const onclickVerde = usuarioLogado ? `onclick="toggleNoVerdeExterno('${pautaId}', '${a.id}', ${a.noVerde || false})"` : '';

                return `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 transition-all hover:shadow-md">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <h3 class="font-black text-slate-800 text-sm">${escapeHTML(a.name || 'Sem Nome')}</h3>
                                <p class="text-[11px] text-slate-400">Status: <span class="font-bold text-slate-600 uppercase">${a.status || 'pauta'}</span></p>
                            </div>
                            <button ${onclickVerde} ${disabledAttr} class="px-3 py-1.5 rounded-xl font-bold text-xs transition-all shadow-sm shrink-0 ${btnVerdeClass}">
                                ${a.noVerde ? '✅ No Verde' : '⏳ Pendente no Verde'}
                            </button>
                        </div>

                        ${usuarioLogado ? `
                            <div class="flex flex-col sm:flex-row gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <div class="flex-1 w-full">
                                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Selecionar PDF (Adobe Scan):</label>
                                    <input type="file" id="file-${a.id}" accept="application/pdf" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100 cursor-pointer">
                                </div>
                                <button onclick="fazerUploadPdf('${pautaId}', '${a.id}')" class="w-full sm:w-auto bg-violet-600 hover:bg-violet-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shrink-0 self-end">
                                    🚀 Enviar para Nuvem
                                </button>
                            </div>
                        ` : ''}

                        <div class="flex gap-2 items-center">
                            <input type="text" id="link-${a.id}" value="${a.pdfLink || ''}" placeholder="Link do PDF na nuvem..." 
                                class="flex-1 p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 outline-none transition" ${!usuarioLogado ? 'readonly' : ''}>
                            
                            ${usuarioLogado ? `
                                <button onclick="salvarLinkExterno('${pautaId}', '${a.id}')" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-3 py-2.5 rounded-xl text-xs transition shrink-0">
                                    Salvar Link
                                </button>
                            ` : ''}

                            ${a.pdfLink ? `
                                <a href="${a.pdfLink}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2.5 rounded-xl text-xs transition flex items-center gap-1 shrink-0 shadow-sm" title="Abrir PDF">
                                    👁️ Abrir PDF
                                </a>
                                <button onclick="enviarWhatsAppAssistido('${escapeHTML(a.name)}', '${a.telefone \vert{}\vert{} ''}', '${a.pdfLink}')" 
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2.5 rounded-xl text-xs transition flex items-center gap-1 shrink-0 shadow-sm" title="Enviar link via WhatsApp">
                                    💬 WhatsApp
                                </button>
                            ` : ''}
                        </div>

                        <div class="flex gap-2 items-center">
                            <input type="text" id="obs-${a.id}" value="${escapeHTML(a.pdfObservacoes || '')}" placeholder="Observações (ex: Falta comprovante...)" 
                                class="flex-1 p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 outline-none transition" ${!usuarioLogado ? 'readonly' : ''}>
                            
                            ${usuarioLogado ? `
                                <button onclick="salvarObsExterno('${pautaId}', '${a.id}')" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shrink-0">
                                    Atualizar Obs
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('filtro-assistido').addEventListener('input', () => {
            if (window._assistidosCache) renderizarLista(window._assistidosCache);
        });

        window.fazerUploadPdf = async function(pautaId, assistidoId) {
            if (!usuarioLogado) return alert("Acesso restrito.");
            const fileInput = document.getElementById(`file-${assistidoId}`);
            if (!fileInput || !fileInput.files[0]) {
                alert("Selecione um arquivo PDF primeiro!");
                return;
            }

            const arquivo = fileInput.files[0];
            const caminhoStorage = `pautas/${pautaId}/${assistidoId}_${Date.now()}.pdf`;
            const storageRef = ref(storage, caminhoStorage);

            alert("Enviando PDF para a nuvem... Aguarde um instante.");

            try {
                const snapshot = await uploadBytes(storageRef, arquivo);
                const downloadUrl = await getDownloadURL(snapshot.ref);

                await updateDoc(doc(db, "pautas", pautaId, "attendances", assistidoId), {
                    pdfLink: downloadUrl,
                    lastActionTimestamp: new Date().toISOString()
                });

                document.getElementById(`link-${assistidoId}`).value = downloadUrl;
                alert("PDF enviado e vinculado com sucesso! 🚀");
                fileInput.value = ''; 
            } catch (error) {
                console.error("Erro no upload:", error);
                alert("Erro ao enviar o arquivo para o Firebase Storage.");
            }
        };

        window.enviarWhatsAppAssistido = function(nomeAssistido, telefoneAssistido, pdfLink) {
            const telLimpo = telefoneAssistido ? telefoneAssistido.replace(/\D/g, '') : '';
            const primeiroNome = nomeAssistido ? nomeAssistido.split(' ')[0] : 'Assistido(a)';
            const mensagem = encodeURIComponent(
                `Olá, ${primeiroNome}! Segue o link com a digitalização da sua documentação realizada em nossa pauta:\n\n📄 ${pdfLink}\n\nGuarde este link para consultas.`
            );

            const urlWa = telLimpo.length >= 10 
                ? `https://wa.me/55${telLimpo}?text=${mensagem}` 
                : `https://wa.me/?text=${mensagem}`;

            window.open(urlWa, '_blank');
        };

        window.salvarLinkExterno = async function(pautaId, assistidoId) {
            if (!usuarioLogado) return alert("Acesso restrito.");
            const val = document.getElementById(`link-${assistidoId}`).value.trim();
            await updateDoc(doc(db, "pautas", pautaId, "attendances", assistidoId), { pdfLink: val });
            alert("Link do PDF salvo com sucesso! 💾");
        }

        window.salvarObsExterno = async function(pautaId, assistidoId) {
            if (!usuarioLogado) return alert("Acesso restrito.");
            const val = document.getElementById(`obs-${assistidoId}`).value.trim();
            await updateDoc(doc(db, "pautas", pautaId, "attendances", assistidoId), { pdfObservacoes: val });
            alert("Observações atualizadas! 📝");
        }

        window.toggleNoVerdeExterno = async function(pautaId, assistidoId, atual) {
            if (!usuarioLogado) return alert("Acesso restrito.");
            await updateDoc(doc(db, "pautas", pautaId, "attendances", assistidoId), { noVerde: !atual });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
        }
    </script>
</body>
</html>
