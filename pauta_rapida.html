<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEP - Pauta Rápida & Gestão de Documentos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Cabeçalho com Logo -->
        <header class="bg-white shadow-sm rounded-2xl p-5 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 border border-slate-200">
            <div class="flex items-center gap-3.5 w-full sm:w-auto">
                <img src="https://firebasestorage.googleapis.com/v0/b/pauta-ce162.firebasestorage.app/o/logo_sigep.png?alt=media&token=b067528b-df81-4fbf-bc22-0d2b01acbbe6" 
                     alt="Logo SIGEP" class="h-12 w-12 object-contain rounded-xl bg-slate-50 p-1 border border-slate-100 shadow-sm shrink-0">
                <div>
                    <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight">
                        SIGEP • Pauta Rápida & Gestão de Documentos
                    </h1>
                    <p id="modo-painel-desc" class="text-xs text-slate-400 font-medium mt-0.5">Verificando conexão...</p>
                </div>
            </div>
            <div id="status-pauta-badge" class="bg-violet-50 text-violet-700 text-xs font-bold px-3.5 py-2 rounded-xl border border-violet-100 shadow-sm shrink-0">
                Aguardando ID...
            </div>
        </header>

        <!-- Barra de Busca -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs">🔍</span>
                <input type="text" id="filtro-assistido" placeholder="Pesquisar assistido com chegada marcada..." 
                    class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white focus:outline-none focus:border-violet-500 transition">
            </div>
            <div class="text-xs text-slate-500 font-bold bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 w-full sm:w-auto text-center" id="contador-status">
                Total: 0 assistidos presentes
            </div>
        </div>

        <!-- Lista de Assistidos -->
        <div id="lista-assistidos-rapida" class="space-y-3">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400 font-medium text-xs">
                Carregando dados da pauta...
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { firebaseConfig } from './js/config.js';

        let db, auth, storage, pautaId;
        let usuarioLogado = false;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            storage = getStorage(app);

            const urlParams = new URLSearchParams(window.location.search);
            pautaId = urlParams.get('pautaId');

            if (!pautaId) {
                document.body.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                        <div class="bg-white p-8 rounded-2xl shadow-xl border border-red-100 text-center max-w-md w-full">
                            <span class="text-4xl mb-3 block">⚠️</span>
                            <h2 class="font-black text-slate-800 text-base mb-1">Pauta não informada</h2>
                            <p class="text-xs text-slate-500">Parâmetro <b>pautaId</b> ausente na URL.</p>
                        </div>
                    </div>`;
            } else {
                onAuthStateChanged(auth, (user) => {
                    usuarioLogado = !!user;
                    atualizarInterfaceModo();
                }, () => {
                    usuarioLogado = false;
                    atualizarInterfaceModo();
                });

                iniciarEscutaFirebase(db, pautaId);
            }
        } catch (erroInit) {
            console.error("Erro crítico:", erroInit);
            document.getElementById('lista-assistidos-rapida').innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-red-200 text-center text-red-600 text-xs font-bold">
                    Erro ao inicializar o Firebase. Verifique o arquivo config.js.
                </div>`;
        }

        function atualizarInterfaceModo() {
            const descEl = document.getElementById('modo-painel-desc');
            if (usuarioLogado) {
                descEl.innerHTML = "Modo Operador: Envio e edições liberados <span class='text-emerald-600 font-bold'>● Ativo</span>";
            } else {
                descEl.innerHTML = "Modo Consulta Externa: Visualização de documentos <span class='text-blue-600 font-bold'>● Leitura</span>";
            }
        }

        function iniciarEscutaFirebase(database, idDaPauta) {
            onSnapshot(doc(database, "pautas", idDaPauta), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('status-pauta-badge').textContent = "Pauta: " + (data.name || 'Ativa');
                } else {
                    document.getElementById('status-pauta-badge').textContent = "Pauta não encontrada";
                }
            });

            const refCol = collection(database, "pautas", idDaPauta, "attendances");
            onSnapshot(refCol, (snapshot) => {
                const assistidos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                const presentes = assistidos.filter(a => {
                    return a.status === 'aguardando' || a.status === 'pausado' || a.arrivalTime || a.chegada === true || a.status === 'presente' || a.status === 'atendido';
                });

                presentes.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                window._assistidosCache = presentes;
                renderizarLista(presentes);
            }, (err) => {
                console.error("Erro ao carregar assistidos:", err);
                document.getElementById('lista-assistidos-rapida').innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-red-200 text-center text-red-600 text-xs font-bold">
                        Erro ao carregar a lista de presentes. Verifique as permissões.
                    </div>`;
            });
        }

        function renderizarLista(assistidos) {
            const container = document.getElementById('lista-assistidos-rapida');
            const termoFiltro = document.getElementById('filtro-assistido').value.toLowerCase().trim();

            const filtrados = assistidos.filter(a => (a.name || '').toLowerCase().includes(termoFiltro));
            document.getElementById('contador-status').textContent = "Total: " + filtrados.length + " assistidos presentes";

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400 text-xs">Nenhum assistido com chegada marcada encontrado nesta pauta.</div>`;
                return;
            }

            let htmlFinal = "";
            for (let i = 0; i < filtrados.length; i++) {
                const a = filtrados[i];
                const btnVerdeClass = a.noVerde ? 'bg-emerald-600 text-white shadow-emerald-100' : 'bg-slate-100 text-slate-700 hover:bg-slate-200';
                const disabledAttr = !usuarioLogado ? 'disabled opacity-75 cursor-not-allowed' : '';
                const onclickVerde = usuarioLogado ? `onclick="toggleNoVerdeExterno('${pautaId}', '${a.id}', ${a.noVerde || false})"` : '';
                
                const nomeSeguro = escapeHTML(a.name || 'Sem Nome');
                const statusSeguro = escapeHTML(a.status || 'aguardando');
                const triagemStatus = escapeHTML(a.docWorkflowStatus || 'Pendente');
                const numAgendamento = escapeHTML(a.numeroAgendamento || a.numAgendamento || a.protocolo || a.codigo || 'N/A');
                const horarioAgendado = escapeHTML(a.scheduledTime || a.horario || a.time || a.hora || '--:--');
                const linkSeguro = a.pdfLink || '';
                const obsSegura = escapeHTML(a.pdfObservacoes || '');
                const telSeguro = a.telefone || '';

                htmlFinal += `
                    <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 transition-all hover:shadow-md">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-black text-slate-900 text-sm sm:text-base">${nomeSeguro}</h3>
                                    <span class="bg-violet-100 text-violet-800 text-[10px] font-bold px-2 py-0.5 rounded-lg">Agendamento: #${numAgendamento}</span>
                                    <span class="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded-lg">⏰ ${horarioAgendado}</span>
                                    <span class="bg-cyan-100 text-cyan-800 text-[10px] font-bold px-2 py-0.5 rounded-lg">📑 Triagem: ${triagemStatus}</span>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-0.5">Status: <span class="font-bold text-slate-700 uppercase">${statusSeguro}</span></p>
                            </div>
                            <button ${onclickVerde} ${disabledAttr} class="px-3.5 py-2 rounded-xl font-black text-xs transition-all shadow-sm shrink-0 ${btnVerdeClass}">
                                ${a.noVerde ? '✅ No Verde' : '⏳ Pendente no Verde'}
                            </button>
                        </div>`;

                if (usuarioLogado) {
                    htmlFinal += `
                        <div class="flex flex-col sm:flex-row gap-2 items-center bg-violet-50/50 p-3 rounded-xl border border-violet-100">
                            <div class="flex-1 w-full">
                                <label class="block text-[10px] font-black uppercase text-violet-700 mb-1">Selecionar PDF (Adobe Scan):</label>
                                <input type="file" id="file-${a.id}" accept="application/pdf" class="w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-violet-600 file:text-white hover:file:bg-violet-700 cursor-pointer">
                            </div>
                            <button onclick="fazerUploadPdf('${pautaId}', '${a.id}')" class="w-full sm:w-auto bg-violet-600 hover:bg-violet-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shrink-0 self-end shadow-sm">
                                🚀 Enviar para Nuvem
                            </button>
                        </div>`;
                }

                htmlFinal += `
                        <div class="flex flex-wrap sm:flex-nowrap gap-2 items-center">
                            <input type="text" id="link-${a.id}" value="${linkSeguro}" placeholder="Link interno/externo do PDF..." 
                                class="flex-1 p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 outline-none transition w-full" ${!usuarioLogado ? 'readonly' : ''}>`;

                if (usuarioLogado) {
                    htmlFinal += `
                            <button onclick="salvarLinkExterno('${pautaId}', '${a.id}')" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-3.5 py-2.5 rounded-xl text-xs transition shrink-0 shadow-sm">
                                Salvar Link
                            </button>`;
                }

                if (linkSeguro) {
                    htmlFinal += `
                            <a href="${linkSeguro}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3.5 py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1 shrink-0 shadow-sm" title="Abrir PDF">
                                👁️ Abrir PDF
                            </a>
                            <button onclick="enviarWhatsAppServidores('${nomeSeguro}', '${numAgendamento}', '${horarioAgendado}', '${linkSeguro}')" 
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3.5 py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1 shrink-0 shadow-sm" title="Avisar equipe no grupo">
                                💬 WhatsApp Servidores
                            </button>`;
                }

                htmlFinal += `
                        </div>
                        <div class="flex gap-2 items-center">
                            <input type="text" id="obs-${a.id}" value="${obsSegura}" placeholder="Observações (ex: Falta comprovante...)" 
                                class="flex-1 p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 outline-none transition" ${!usuarioLogado ? 'readonly' : ''}>`;

                if (usuarioLogado) {
                    htmlFinal += `
                            <button onclick="salvarObsExterno('${pautaId}', '${a.id}')" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shrink-0 shadow-sm">
                                Atualizar Obs
                            </button>`;
                }

                htmlFinal += `
                        </div>
                    </div>`;
            }

            container.innerHTML = htmlFinal;
        }

        document.getElementById('filtro-assistido').addEventListener('input', () => {
            if (window._assistidosCache) renderizarLista(window._assistidosCache);
        });

        // 🌟 UPLOAD COM ATUALIZAÇÃO AUTOMÁTICA DO STATUS PARA "Digitalizado" 🌟
        window.fazerUploadPdf = async function(idPauta, idAssistido) {
            if (!usuarioLogado) return alert("Acesso restrito.");
            const fileInput = document.getElementById(`file-${idAssistido}`);
            if (!fileInput || !fileInput.files[0]) {
                alert("Selecione um arquivo PDF primeiro!");
                return;
            }

            const arquivo = fileInput.files[0];
            const caminhoStorage = `pautas/${idPauta}/assistidos/${idAssistido}/documento_${Date.now()}.pdf`;
            const storageRef = ref(storage, caminhoStorage);

            alert("Enviando PDF para a pasta do assistido na nuvem... Aguarde.");

            try {
                const snapshot = await uploadBytes(storageRef, arquivo);
                const downloadUrl = await getDownloadURL(snapshot.ref);

                await updateDoc(doc(db, "pautas", idPauta, "attendances", idAssistido), {
                    pdfLink: downloadUrl,
                    docWorkflowStatus: "Digitalizado",
                    lastActionTimestamp: new Date().toISOString()
                });

                document.getElementById(`link-${idAssistido}`).value = downloadUrl;
                alert("PDF enviado e status atualizado para 'Digitalizado' com sucesso! 🚀");
                fileInput.value = ''; 
            } catch (error) {
                console.error("Erro no upload:", error);
                alert("Erro ao enviar o arquivo para o Firebase Storage.");
            }
        };

        // 🌟 SALVAR LINK MANUAL COM ATUALIZAÇÃO AUTOMÁTICA DO STATUS PARA "Digitalizado" 🌟
        window.salvarLinkExterno = async function(idPauta, idAssistido) {
            if (!usuarioLogado) return alert("Acesso restrito.");
            const val = document.getElementById(`link-${idAssistido}`).value.trim();
            await updateDoc(doc(db, "pautas", idPauta, "attendances", idAssistido), { 
                pdfLink: val,
                docWorkflowStatus: "Digitalizado"
            });
            alert("Link do PDF salvo e status atualizado para 'Digitalizado'! 💾");
        }

        window.salvarObsExterno = async function(idPauta, idAssistido) {
            if (!usuarioLogado) return alert("Acesso restrito.");
            const val = document.getElementById(`obs-${idAssistido}`).value.trim();
            await updateDoc(doc(db, "pautas", idPauta, "attendances", idAssistido), { pdfObservacoes: val });
            alert("Observações atualizadas! 📝");
        }

        // 🌟 TOGGLE NO VERDE COM ATUALIZAÇÃO AUTOMÁTICA DO STATUS PARA "Inserido no Verde" 🌟
        window.toggleNoVerdeExterno = async function(idPauta, idAssistido, atual) {
            if (!usuarioLogado) return alert("Acesso restrito.");
            const novoEstado = !atual;
            await updateDoc(doc(db, "pautas", idPauta, "attendances", idAssistido), { 
                noVerde: novoEstado,
                docWorkflowStatus: novoEstado ? "Inserido no Verde" : "Digitalizado"
            });
        }

        window.enviarWhatsAppServidores = function(nomeAssistido, numAgendamento, horarioAgendado, pdfLink) {
            const textoMensagem = 
                `*ATUALIZACAO DE DOCUMENTACAO - SIGEP*\n\n` +
                `Assistido(a): ${nomeAssistido}\n` +
                `Agendamento: #${numAgendamento}\n` +
                `Horario: ${horarioAgendado}\n\n` +
                `Documentacao digitalizada e enviada para a nuvem com sucesso!\n` +
                `Link do PDF: ${pdfLink}\n\n` +
                `_Mensagem gerada automaticamente pelo sistema SIGEP._`;

            const urlWa = `https://wa.me/?text=${encodeURIComponent(textoMensagem)}`;
            window.open(urlWa, '_blank');
        };

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
        }
    </script>
</body>
</html>
