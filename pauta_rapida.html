
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEP • Gestão de Documentos</title>
    <!-- Favicon Oficial -->
    <link rel="icon" type="image/png" href="https://firebasestorage.googleapis.com/v0/b/pauta-ce162.firebasestorage.app/o/Logo%2FLogo-sem-texto-sem-fundo.PNG?alt=media&token=71f18590-da74-40f9-a692-20843d4567da">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .transition-all-custom { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 min-h-screen flex flex-col justify-between">

    <div id="conteudo-principal" class="max-w-4xl mx-auto p-4 sm:p-6 w-full flex-1">
        <!-- Cabeçalho Profissional -->
        <header class="bg-white shadow-sm rounded-2xl p-5 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 border border-slate-200/80">
            <div class="flex items-center gap-4 w-full sm:w-auto">
                
                <!-- LOGO VERTICAL ATUALIZADA (SEM FUNDO/SOMBREAMENTO) -->
                <img src="https://firebasestorage.googleapis.com/v0/b/pauta-ce162.firebasestorage.app/o/Logo%2FLogo-sigla-texto-vertical.PNG?alt=media&token=04da91f2-0a53-4d4a-ae10-287ab7bdc86e" 
                     alt="Logo SIGEP" 
                     class="h-12 sm:h-14 w-auto object-contain shrink-0">
                
                <div>
                    <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight">
                        SIGEP • Gestão de Documentos
                    </h1>
                    <p id="modo-painel-desc" class="text-xs text-slate-500 font-medium mt-0.5 flex items-center gap-1.5"><svg class="w-3.5 h-3.5 animate-spin text-slate-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Verificando status da pauta...</p>
                </div>
            </div>
            <div id="status-pauta-badge" class="bg-emerald-50 text-emerald-700 text-xs font-bold px-4 py-2 rounded-xl border border-emerald-200/60 shadow-sm shrink-0 flex items-center gap-2">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="nome-pauta-texto">Carregando pauta...</span>
            </div>
        </header>

        <!-- Barra de Busca Avançada -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="relative w-full sm:w-[420px]">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></span>
                <input type="search" id="filtro-assistido" placeholder="Pesquisar por nome do assistido..." 
                    class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50/50 focus:bg-white focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all-custom font-medium">
            </div>
            <div class="text-xs text-slate-600 font-bold bg-slate-100/70 px-4 py-2.5 rounded-xl border border-slate-200/60 w-full sm:w-auto text-center flex items-center justify-center gap-1.5" id="contador-status">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> 0 presentes na fila
            </div>
        </div>

        <!-- Lista de Assistidos -->
        <div id="lista-assistidos-rapida" class="space-y-3.5">
            <div class="bg-white p-10 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400 font-medium text-xs flex flex-col items-center justify-center gap-2">
                <svg class="w-6 h-6 animate-spin text-slate-300" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Carregando registros da pauta...
            </div>
        </div>
    </div>

    <!-- Rodapé Profissional -->
    <footer class="w-full py-6 bg-white border-t border-slate-200 mt-8 text-center text-slate-400 text-[11px] font-bold uppercase tracking-widest">
        SIGEP • Sistema Integrado de Gestão de Pautas e Documentos
    </footer>

    <!-- Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc, arrayUnion, arrayRemove, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { firebaseConfig } from './js/config.js';

        let db, auth, storage, pautaId;
        let modoLeituraExterna = false;
        let usuarioOperadorLogado = false;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            storage = getStorage(app);

            const urlParams = new URLSearchParams(window.location.search);
            pautaId = urlParams.get('pautaId');
            const modoUrl = urlParams.get('modo');

            if (modoUrl === 'leitura') {
                modoLeituraExterna = true;
            }

            if (!pautaId) {
                exibirErroExpiracao("Pauta não informada", "Parâmetro <b>pautaId</b> ausente na URL de acesso.");
            } else {
                verificarValidadePauta(db, pautaId).then((pautaValida) => {
                    if (!pautaValida) return;

                    onAuthStateChanged(auth, (user) => {
                        usuarioOperadorLogado = !!user;
                        if (user && modoUrl !== 'leitura') {
                            modoLeituraExterna = false;
                        }
                        atualizarInterfaceModo();
                    }, () => {
                        usuarioOperadorLogado = false;
                        if (modoUrl === 'leitura') modoLeituraExterna = true;
                        atualizarInterfaceModo();
                    });

                    iniciarEscutaFirebase(db, pautaId);
                });
            }
        } catch (erroInit) {
            console.error("Erro crítico:", erroInit);
            document.getElementById('lista-assistidos-rapida').innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-red-200 text-center text-red-600 text-xs font-bold flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Erro ao inicializar serviços do Firebase. Verifique o arquivo config.js.
                </div>`;
        }

        async function verificarValidadePauta(database, idDaPauta) {
            try {
                const pautaDoc = await getDoc(doc(database, "pautas", idDaPauta));
                if (!pautaDoc.exists()) {
                    exibirErroExpiracao("Pauta não encontrada", "O registro desta pauta não existe ou foi excluído do sistema.");
                    return false;
                }

                const dataPauta = pautaDoc.data();

                if (dataPauta.isClosed === true) {
                    exibirErroExpiracao("Pauta Encerrada", "Este link não está mais acessível pois a pauta foi fechada pelo operador responsável.");
                    return false;
                }

                document.getElementById('nome-pauta-texto').textContent = dataPauta.name || 'Pauta Ativa';
                return true;
            } catch (err) {
                console.error("Erro ao validar pauta:", err);
                return true; 
            }
        }

        function exibirErroExpiracao(titulo, mensagem) {
            document.getElementById('conteudo-principal').innerHTML = `
                <div class="min-h-[70vh] flex items-center justify-center p-4">
                    <div class="bg-white p-8 rounded-2xl shadow-xl border border-amber-200 text-center max-w-md w-full">
                        <span class="mb-4 flex justify-center text-amber-500"><svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg></span>
                        <h2 class="font-black text-slate-800 text-base mb-1">${titulo}</h2>
                        <p class="text-xs text-slate-500 mt-2">${mensagem}</p>
                        <div class="mt-6 pt-4 border-t border-slate-100 text-[11px] text-slate-400 font-bold uppercase tracking-wider">
                            SIGEP • Segurança e Privacidade
                        </div>
                    </div>
                </div>`;
        }

        function atualizarInterfaceModo() {
            const descEl = document.getElementById('modo-painel-desc');
            if (!modoLeituraExterna) {
                descEl.innerHTML = "Modo Operador: Ferramentas liberadas <span class='text-emerald-600 font-bold'>● Ativo</span>";
            } else {
                descEl.innerHTML = "Modo Equipe (Leitura): Apenas visualização <span class='text-violet-600 font-bold'>● Restrito</span>";
            }
            if (window._assistidosCache) renderizarLista(window._assistidosCache);
        }

        function iniciarEscutaFirebase(database, idDaPauta) {
            onSnapshot(doc(database, "pautas", idDaPauta), (docSnap) => {
                if (docSnap.exists() && docSnap.data().isClosed === true) {
                    exibirErroExpiracao("Pauta Encerrada", "O operador encerrou esta pauta neste momento. O acesso aos documentos foi bloqueado.");
                }
            });

            const refCol = collection(database, "pautas", idDaPauta, "attendances");
            onSnapshot(refCol, (snapshot) => {
                const assistidos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                const presentes = assistidos.filter(a => {
                    return a.status === 'aguardando' || a.status === 'pausado' || a.arrivalTime || a.chegada === true || a.status === 'presente' || a.status === 'atendido';
                });

                presentes.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                window._assistidosCache = presentes;
                renderizarLista(presentes);
            }, (err) => {
                console.error("Erro ao carregar assistidos:", err);
            });
        }

        function renderizarLista(assistidos) {
            const container = document.getElementById('lista-assistidos-rapida');
            const termoFiltro = document.getElementById('filtro-assistido').value.toLowerCase().trim();

            const filtrados = assistidos.filter(a => (a.name || '').toLowerCase().includes(termoFiltro));
            document.getElementById('contador-status').innerHTML = `<svg class="w-4 h-4 text-slate-500 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> ${filtrados.length} presentes na fila`;

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400 font-medium text-xs flex flex-col items-center justify-center gap-2"><svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> Nenhum assistido com chegada marcada encontrado.</div>`;
                return;
            }

            let htmlFinal = "";
            for (let i = 0; i < filtrados.length; i++) {
                const a = filtrados[i];
                const btnVerdeClass = a.noVerde ? 'bg-emerald-600 text-white shadow-emerald-200' : 'bg-slate-100 text-slate-700 hover:bg-slate-200';
                const disabledAttr = modoLeituraExterna ? 'disabled opacity-75 cursor-not-allowed' : '';
                const onclickVerde = !modoLeituraExterna ? `onclick="toggleNoVerdeExterno('${pautaId}', '${a.id}', ${a.noVerde || false})"` : '';
                
                const nomeSeguro = escapeHTML(a.name || 'Sem Nome');
                const statusSeguro = escapeHTML(a.status || 'aguardando');
                const triagemStatus = escapeHTML(a.docWorkflowStatus || 'Pendente');
                const numAgendamento = escapeHTML(a.numeroAgendamento || a.numAgendamento || a.protocolo || a.codigo || 'N/A');
                const horarioAgendado = escapeHTML(a.scheduledTime || a.horario || a.time || a.hora || '--:--');
                const obsSegura = escapeHTML(a.pdfObservacoes || '');

                let listaDocs = a.documentosLista || [];
                if (listaDocs.length === 0 && a.pdfLink) {
                    listaDocs = [{ descricao: 'Documento Principal', url: a.pdfLink }];
                }

                let historicoHTML = '';
                if (a.historicoAcoes && a.historicoAcoes.length > 0) {
                    historicoHTML = `<div class="mt-2 pt-2 border-t border-slate-100 flex items-center gap-2 flex-wrap text-[10px] text-slate-500">
                        <span class="font-bold text-slate-600">Histórico de Atividades:</span>`;
                    a.historicoAcoes.forEach(h => {
                        historicoHTML += `<span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200 font-medium">${h}</span>`;
                    });
                    historicoHTML += `</div>`;
                }

                htmlFinal += `
                    <div class="bg-white p-4.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-3 transition-all-custom hover:shadow-md hover:border-slate-300">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-black text-slate-900 text-sm sm:text-base">${nomeSeguro}</h3>
                                    <span class="bg-violet-50 text-violet-700 border border-violet-200/60 text-[10px] font-black px-2.5 py-0.5 rounded-lg flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path></svg> ${numAgendamento}</span>
                                    <span class="bg-slate-100 text-slate-700 border border-slate-200/60 text-[10px] font-bold px-2.5 py-0.5 rounded-lg flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> ${horarioAgendado}</span>
                                    <span class="bg-cyan-50 text-cyan-800 border border-cyan-200/60 text-[10px] font-bold px-2.5 py-0.5 rounded-lg flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> ${triagemStatus}</span>
                                </div>
                                <p class="text-[11px] text-slate-400 font-medium mt-1">Status na Fila: <span class="font-bold text-slate-700 uppercase">${statusSeguro}</span></p>
                            </div>
                            <button ${onclickVerde} ${disabledAttr} class="px-4 py-2 rounded-xl font-black text-xs transition-all-custom shadow-sm shrink-0 flex items-center gap-1.5 ${btnVerdeClass}">
                                ${a.noVerde ? '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> No Verde / CNP' : '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Pendente Verde'}
                            </button>
                        </div>`;

                if (!modoLeituraExterna) {
                    htmlFinal += `
                        <div class="flex flex-col sm:flex-row gap-2.5 items-center bg-violet-50/40 p-3 rounded-xl border border-violet-100/80">
                            <div class="flex-1 w-full">
                                <label class="text-[10px] font-black uppercase text-violet-700 mb-1 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> Upload de PDF (Adobe Scan / Arquivo):</label>
                                <input type="file" id="file-${a.id}" accept="application/pdf" class="w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-violet-600 file:text-white hover:file:bg-violet-700 cursor-pointer">
                            </div>
                            <button onclick="fazerUploadPdf('${pautaId}', '${a.id}')" class="w-full sm:w-auto bg-violet-600 hover:bg-violet-700 text-white font-black px-4 py-2.5 rounded-xl text-xs transition-all-custom shrink-0 self-end shadow-sm flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> Enviar para Nuvem
                            </button>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col sm:flex-row gap-2 items-center">
                            <input type="text" id="desc-novo-${a.id}" placeholder="Descrição (Ex: RG, CPF, Certidão...)" class="w-full sm:w-1/3 p-2 border border-slate-200 rounded-lg text-xs bg-white outline-none">
                            <input type="text" id="link-novo-${a.id}" placeholder="Cole o URL do documento aqui..." class="flex-1 w-full p-2 border border-slate-200 rounded-lg text-xs bg-white outline-none">
                            <button onclick="adicionarLinkManual('${pautaId}', '${a.id}')" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs transition shrink-0 flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Adicionar Link
                            </button>
                        </div>`;
                }

                htmlFinal += `<div class="space-y-2 mt-2">`;
                if (listaDocs.length === 0) {
                    htmlFinal += `<p class="text-xs text-slate-400 italic">Nenhum documento anexado ainda.</p>`;
                } else {
                    listaDocs.forEach((docItem, index) => {
                        const isFirebaseStorage = docItem.url.includes('firebasestorage.googleapis.com');
                        const attrDownload = isFirebaseStorage ? 'download' : '';
                        const svgBotaoLink = isFirebaseStorage ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg> Abrir / Baixar' : '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg> Abrir Link';

                        htmlFinal += `
                            <div class="flex flex-col sm:flex-row gap-2 items-center bg-slate-100/70 p-2.5 rounded-xl border border-slate-200">
                                <span class="text-xs font-bold text-slate-700 w-full sm:w-1/3 truncate flex items-center gap-1.5" title="${escapeHTML(docItem.descricao)}"><svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> ${escapeHTML(docItem.descricao)}</span>
                                <input type="text" value="${escapeHTML(docItem.url)}" class="flex-1 w-full p-2 border border-slate-200 rounded-lg text-xs bg-white outline-none text-slate-600" readonly>
                                <div class="flex gap-1.5 w-full sm:w-auto justify-end">
                                    <a href="${docItem.url}" target="_blank" ${attrDownload} onclick="registrarAcaoHistorico('${pautaId}', '${a.id}', 'Consultou documento: ${escapeHTML(docItem.descricao)}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded-lg text-xs transition flex items-center justify-center gap-1 shrink-0">
                                        ${svgBotaoLink}
                                    </a>`;
                        
                        if (!modoLeituraExterna) {
                            htmlFinal += `
                                    <button onclick="removerDocumento('${pautaId}', '${a.id}', '${docItem.url}')" class="bg-red-500 hover:bg-red-600 text-white font-bold px-2.5 py-2 rounded-lg text-xs transition" title="Excluir link">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>`;
                        }

                        htmlFinal += `</div></div>`;
                    });
                }
                htmlFinal += `</div>`;

                if (!modoLeituraExterna && listaDocs.length > 0) {
                    const primeiroLink = listaDocs[0].url;
                    htmlFinal += `
                        <div class="flex justify-end mt-1">
                            <button onclick="enviarWhatsAppServidores('${pautaId}', '${a.id}', '${nomeSeguro}', '${numAgendamento}', '${horarioAgendado}', '${primeiroLink}')" 
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg> Avisar Equipe via WhatsApp (${listaDocs.length} docs)
                            </button>
                        </div>`;
                }

                htmlFinal += `
                        <div class="flex gap-2 items-center mt-2">
                            <input type="text" id="obs-${a.id}" value="${obsSegura}" placeholder="Observações rápidas..." 
                                class="flex-1 p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50/50 outline-none transition-all-custom focus:bg-white focus:border-slate-400" ${modoLeituraExterna ? 'readonly' : ''}>`;

                if (!modoLeituraExterna) {
                    htmlFinal += `
                            <button onclick="salvarObsExterno('${pautaId}', '${a.id}')" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition-all-custom shrink-0 shadow-sm">
                                Atualizar Obs
                            </button>`;
                }

                htmlFinal += `
                        </div>
                        ${historicoHTML}
                    </div>`;
            }

            container.innerHTML = htmlFinal;
        }

        document.getElementById('filtro-assistido').addEventListener('input', () => {
            if (window._assistidosCache) renderizarLista(window._assistidosCache);
        });

        window.registrarAcaoHistorico = async function(idPauta, idAssistido, acaoDesc) {
            try {
                const horaFormatada = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                const registro = `${acaoDesc} às ${horaFormatada}`;
                const assistidoRef = doc(db, "pautas", idPauta, "attendances", idAssistido);
                
                const { arrayUnion } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                await updateDoc(assistidoRef, {
                    historicoAcoes: arrayUnion(registro)
                });
            } catch (e) {
                console.error("Erro ao registrar histórico:", e);
            }
        };

        window.fazerUploadPdf = async function(idPauta, idAssistido) {
            if (modoLeituraExterna) return alert("Acesso restrito.");
            const fileInput = document.getElementById(`file-${idAssistido}`);
            if (!fileInput || !fileInput.files[0]) {
                alert("Selecione um arquivo PDF primeiro!");
                return;
            }

            const arquivo = fileInput.files[0];
            const nomeOriginal = arquivo.name.replace(/\.[^/.]+$/, "");
            const caminhoStorage = `pautas/${idPauta}/assistidos/${idAssistido}/documento_${Date.now()}.pdf`;
            const storageRef = ref(storage, caminhoStorage);

            alert("Enviando PDF para a nuvem... Aguarde.");

            try {
                const snapshot = await uploadBytes(storageRef, arquivo);
                const downloadUrl = await getDownloadURL(snapshot.ref);

                const novoDoc = { descricao: nomeOriginal || 'Documento Digitalizado', url: downloadUrl };

                const assistidoRef = doc(db, "pautas", idPauta, "attendances", idAssistido);
                await updateDoc(assistidoRef, {
                    documentosLista: arrayUnion(novoDoc),
                    pdfLink: downloadUrl,
                    docWorkflowStatus: "Digitalizado",
                    lastActionTimestamp: new Date().toISOString()
                });

                await registrarAcaoHistorico(idPauta, idAssistido, `Upload do documento: ${novoDoc.descricao}`);
                alert("PDF enviado com sucesso! 🚀");
                fileInput.value = ''; 
            } catch (error) {
                console.error("Erro no upload:", error);
                alert("Erro ao enviar o arquivo para o Firebase Storage.");
            }
        };

        window.adicionarLinkManual = async function(idPauta, idAssistido) {
            if (modoLeituraExterna) return alert("Acesso restrito.");
            const descInput = document.getElementById(`desc-novo-${idAssistido}`);
            const linkInput = document.getElementById(`link-novo-${idAssistido}`);
            
            const descricao = descInput.value.trim() || 'Documento Externo';
            const url = linkInput.value.trim();

            if (!url) {
                alert("Insira o link/URL do documento!");
                return;
            }

            const novoDoc = { descricao, url };
            const assistidoRef = doc(db, "pautas", idPauta, "attendances", idAssistido);

            try {
                await updateDoc(assistidoRef, {
                    documentosLista: arrayUnion(novoDoc),
                    docWorkflowStatus: "Digitalizado"
                });

                await registrarAcaoHistorico(idPauta, idAssistido, `Adicionou link: ${descricao}`);
                descInput.value = '';
                linkInput.value = '';
                alert("Link adicionado com sucesso! 💾");
            } catch (err) {
                console.error(err);
                alert("Erro ao salvar o link.");
            }
        };

        window.removerDocumento = async function(idPauta, idAssistido, urlParaRemover) {
            if (modoLeituraExterna) return alert("Acesso restrito.");
            if (!confirm("Deseja realmente remover este documento da lista?")) return;

            try {
                const assistido = window._assistidosCache?.find(a => a.id === idAssistido);
                if (!assistido || !assistido.documentosLista) return;

                const docEncontrado = assistido.documentosLista.find(d => d.url === urlParaRemover);
                if (!docEncontrado) return;

                const assistidoRef = doc(db, "pautas", idPauta, "attendances", idAssistido);
                await updateDoc(assistidoRef, {
                    documentosLista: arrayRemove(docEncontrado)
                });

                await registrarAcaoHistorico(idPauta, idAssistido, `Removeu documento: ${docEncontrado.descricao}`);
                alert("Documento removido.");
            } catch (err) {
                console.error(err);
                alert("Erro ao remover o documento.");
            }
        };

        window.salvarObsExterno = async function(idPauta, idAssistido) {
            if (modoLeituraExterna) return alert("Acesso restrito.");
            const val = document.getElementById(`obs-${idAssistido}`).value.trim();
            await updateDoc(doc(db, "pautas", idPauta, "attendances", idAssistido), { pdfObservacoes: val });
            alert("Observações atualizadas! 📝");
        }

        window.toggleNoVerdeExterno = async function(idPauta, idAssistido, atual) {
            if (modoLeituraExterna) return alert("Acesso restrito.");
            const novoEstado = !atual;
            await updateDoc(doc(db, "pautas", idPauta, "attendances", idAssistido), { 
                noVerde: novoEstado,
                docWorkflowStatus: novoEstado ? "Inserido no Verde/CNP" : "Digitalizado"
            });
            await registrarAcaoHistorico(idPauta, idAssistido, novoEstado ? "Marcado como No Verde" : "Removido do Verde");
        }

        window.enviarWhatsAppServidores = async function(idPauta, idAssistido, nomeAssistido, numAgendamento, horarioAgendado, pdfLink) {
            if (modoLeituraExterna) return;
            await registrarAcaoHistorico(idPauta, idAssistido, "Aviso enviado via WhatsApp");

            const textoMensagem = 
                `*ATUALIZACAO DE DOCUMENTACAO - SIGEP*\n\n` +
                `Assistido(a): ${nomeAssistido}\n` +
                `Agendamento: #${numAgendamento}\n` +
                `Horario: ${horarioAgendado}\n\n` +
                `Documentacao digitalizada e enviada para a nuvem com sucesso!\n` +
                `Link: ${pdfLink}\n\n` +
                `_Mensagem gerada automaticamente pelo sistema SIGEP._`;

            const urlWa = `https://wa.me/?text=${encodeURIComponent(textoMensagem)}`;
            window.open(urlWa, '_blank');
        };

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
        }
    </script>
</body>
</html>
